x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  profiles: [pipeline]
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    # The complete connection URI can be overridden from the shell or .env.
    # The default uses the credentials configured on airflow-postgres below.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:-postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow}"
    # Empty by default = encryption disabled, which is fine for local dev.
    # scripts/bootstrap.sh generates a real one into .env on first run. A non-empty
    # value MUST be a valid Fernet key (32 url-safe base64-encoded bytes) -- a plain
    # placeholder string like "key" makes Airflow crash on startup
    # (cryptography.fernet.Fernet rejects it immediately).
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW__CORE__FERNET_KEY:-}"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    # Local-dev-only default. scripts/bootstrap.sh generates a real one into .env;
    # this fallback exists only so the stack still starts if that step was skipped.
    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW__API_AUTH__JWT_SECRET:-insecure-local-dev-secret-change-me}"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Callable logging
    AIRFLOW__LOGGING__HOSTNAME_CALLABLE: "socket:gethostname"
    AIRFLOW__CORE__PLUGINS_FOLDER: "/opt/airflow/plugins"
    # Must match the volume mount below (${AIRFLOW_PROJ_DIR:-.}/airflow/logs ->
    # /opt/airflow/logs) -- /var/log/airflow is neither mounted nor writable by
    # the airflow UID (50000), so tasks crashed with "Permission denied" before
    # ever writing a log or reporting their hostname, surfacing as the unrelated
    # "Could not read served logs: Hostname not available for worker" UI error.
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: "/opt/airflow/logs"
    AIRFLOW__LOGGING__DAG_PROCESSOR_MANAGER_LOG_LOCATION: "/opt/airflow/logs/dag_processor_manager/dag_processor_manager.log"


  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/airflow/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/airflow/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/airflow/logs:/opt/airflow/logs
    - ./airflow/airflow.cfg:/opt/airflow/airflow.cfg:ro  # read-only
    # Named volumes (not bind mounts) initialize root:root -- listed here too,
    # not just on airflow-scheduler below, so airflow-init can see and chown the
    # actual volumes (see its command). Without this it has no /staging or
    # /duckdb path to chown at all, and tasks that write there (export_staging_jsonl,
    # any duckdb-backed transform) fail with "Permission denied" under uid 50000.
    - staging:/staging
    - duckdbdata:/duckdb

  # MUST default to 50000: the base image bakes in a real `airflow` user at exactly
  # that UID (with HOME=/home/airflow) at build time. airflow-init below overrides
  # `entrypoint:` to run a raw script directly, bypassing the image's own
  # `/entrypoint` (which is what normally sets HOME/PYTHONPATH correctly for an
  # arbitrary UID). Any UID other than 50000 has no matching /etc/passwd entry in
  # that case, HOME never resolves to /home/airflow, and every `airflow` command
  # fails with "ModuleNotFoundError: No module named 'airflow'" even though the
  # package is installed and present on disk.
  user: "${AIRFLOW_UID:-50000}:0"
  networks: [c3net]
  depends_on: &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy

networks:
  c3net:
    name: c3net

volumes:
  airflowdb:
  events:
  staging:
  modelcache:
  pathwaystate:
  duckdbdata:

services:
  # ────────────────────────────── pipeline ──────────────────────────────
  # Airflow's OWN metadata store -- unrelated to the warehouse Postgres (Neon) or
  # the account-state Redis (managed) that `pathway`/`scorer`/`ui` talk to below,
  # both external now. This file has no local `postgres`/`redis` service at all --
  # see compose.parity.yaml for the local-native stack that still does.
  airflow-postgres:
    image: postgres:17-alpine
    profiles: [pipeline]
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      # Must match the credentials in the default Airflow connection URI above.
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflowdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [c3net]
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    # Do NOT call `airflow db migrate` (or any `airflow` subcommand) directly from
    # this bash script -- the image's real ENTRYPOINT (/entrypoint) is what sets up
    # HOME and PYTHONPATH correctly for whichever UID the container runs as
    # (including root's PYTHONPATH-specific workaround, since Python disables
    # user-site packages entirely for EUID 0). Skipping it is exactly what produces
    # "ModuleNotFoundError: No module named 'airflow'" despite the package being on
    # disk. Instead: do the plain-coreutils setup here, then `exec /entrypoint` with
    # zero arguments -- which, combined with _AIRFLOW_DB_MIGRATE/
    # _AIRFLOW_WWW_USER_CREATE below, runs the real migrate+create-user logic
    # in-process and exits 0. See scripts/docker/entrypoint_prod.sh in apache/airflow.
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        mkdir -v -p /opt/airflow/logs
        # The bind mount inherits the host directory's ownership (uid 1000, the
        # host user) with no group-write bit, but every airflow-* service below
        # runs as uid 50000. Without this chown, tasks fail with
        # "Permission denied" writing their own log file -- the scheduler then
        # reports it to the API server as the misleading
        # "Could not read served logs: Hostname not available for worker" error.
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs
        # staging/duckdbdata are named volumes, not bind mounts -- Docker
        # initializes them root:root on first use regardless of host ownership.
        # export_staging_jsonl (writes /staging) and any duckdb-backed transform
        # (writes /duckdb) fail with "Permission denied" under uid 50000 without this.
        chown -R "${AIRFLOW_UID:-50000}:0" /staging /duckdb
        exec /entrypoint
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      # _AIRFLOW_WWW_USER_USERNAME / _AIRFLOW_WWW_USER_PASSWORD come from .env via
      # env_file above -- no need to redeclare them here with interpolation.
    # root, matching upstream's own reference file: db migrate on a brand-new volume
    # and the log-directory creation both benefit from not being UID-restricted on
    # first run. Every other airflow-* service runs as the AIRFLOW_UID (50000)
    # inherited from the anchor above.
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    # LocalExecutor forks task subprocesses under the SCHEDULER, not the apiserver --
    # so this is the service that needs the warehouse-adjacent volumes tasks read
    # and write (staging exports, the DuckDB file, the read-only event log, and the
    # local PaySim CSV cache).
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/airflow/dags:/opt/airflow/dags
      - ${AIRFLOW_PROJ_DIR:-.}/airflow/plugins:/opt/airflow/plugins
      - ${AIRFLOW_PROJ_DIR:-.}/airflow/logs:/opt/airflow/logs
      - staging:/staging
      - duckdbdata:/duckdb
      - events:/events:ro
      - ${AIRFLOW_PROJ_DIR:-.}/data:/data
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ─────────────────────────────── stream ───────────────────────────────
  pathway:
    build:
      context: .
      dockerfile: docker/pathway.Dockerfile
    profiles: [stream]
    env_file:
      - .env
    # POSTGRES_HOST/REDIS_HOST come straight from .env, unmodified: the warehouse
    # Postgres (Neon) and the account-state Redis (managed) are both external
    # services, reachable directly from this container same as from the host.
    # This file has no local `postgres`/`redis` service at all (see
    # compose.parity.yaml for that local-native form) -- nothing to depends_on.
    volumes:
      - events:/events:ro
      - staging:/staging:ro
      - pathwaystate:/pathway-state
    networks: [c3net]
    restart: unless-stopped
    # Layer 3b: pipelines/pathway/run_backfill.py (static mode) and
    # run_streaming.py (streaming mode), selected by C3_PATHWAY_MODE (see
    # docker/pathway.Dockerfile's CMD). staging is read-only here -- only
    # `conquer3 transform export-staging` (host CLI today; an Airflow task from
    # Layer 6) writes it.

  # ─────────────────────────────── serving ───────────────────────────────
  # This container IS the inference endpoint -- it pulls the champion artifact
  # out of remote MLflow once at boot and serves /invocations entirely from
  # local files, managed Redis, and local CPU from then on. It is not a gateway
  # or proxy in front of remote MLflow; see README's Layer 5 section.
  scorer:
    build:
      context: .
      dockerfile: docker/serving.Dockerfile
    profiles: [serving]
    env_file:
      - .env
    # REDIS_HOST comes straight from .env, unmodified -- account-state Redis is
    # an external managed service (see the `pathway` service's comment). Only the
    # model-cache paths below are overridden: `data/models` is a host-relative
    # path that doesn't exist inside this container, and needs to point at the
    # mounted `modelcache` volume instead.
    environment:
      C3_MODEL_CACHE_DIR: /models
      C3_MODEL_CHAMPION_CACHE_FILE: /models/champion.json
      C3_ACTIVE_CHAMPION_FILE: /models/active.json
      # Local dev only: bentoml serve --reload watches ./src (bind-mounted
      # below) via watchfiles and restarts the child on change -- no more
      # `docker compose build scorer` + recreate per edit. Never set this
      # outside a dev compose file.
      C3_SCORER_RELOAD: "true"
      # OTEL_EXPORTER_OTLP_ENDPOINT: not overridden -- see the same note on the
      # `pathway` service above.
    # Lets MLFLOW_TRACKING_URI=http://host.docker.internal:<port> reach an
    # MLflow server running on the host (e.g. a throwaway `mlflow server` for a
    # local demo) -- confirmed this does NOT resolve by default on Linux Docker
    # Engine (only Docker Desktop), so it's declared explicitly rather than
    # assumed. A real remote MLflow address needs no such thing.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # C3_SCORER_HOST_PORT is deliberately a separate var from C3_SCORER_PORT:
      # the latter also reaches the container via env_file and picks the
      # in-container `bentoml serve --port` (see supervisor.py), which the
      # healthcheck below and `EXPOSE 3000` assume is 3000. Remapping the
      # published host port must not perturb that.
      - "${C3_SCORER_HOST_PORT:-3000}:3000"
    volumes:
      - events:/events
      - modelcache:/models
      - ./data/models:/models
      # Local dev: host edits under src/ land in the container immediately --
      # the editable install (serving.Dockerfile) makes `conquer3` resolve
      # here instead of a copy baked into the image at build time.
      - ./src:/app/src
    networks: [c3net]
    # No depends_on: account-state Redis is an external managed service, no local
    # `redis` service in this file to depend on (see compose.parity.yaml).
    healthcheck:
      # BentoML's own readiness route: 500 until the workers finish __init__,
      # which is exactly "the champion is loaded". /livez and /healthz answer
      # earlier (process is up) and would mark the container healthy too soon.
      test: ["CMD", "curl", "--fail", "http://localhost:3000/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    # conquer3 serve (src/conquer3/serving/supervisor.py) -- Layer 5:
    # resolves the champion, then supervises a `bentoml serve` child.

  # ─────────────────────────────── ui ───────────────────────────────
  # Streamlit console (Layer 9): Inference + Inspection tabs. A client of scorer
  # over HTTP -- holds no model, computes no feature. On its own profile since it
  # is a standalone, optional add-on: bringing it up also needs `serving` (for
  # `scorer`) in scope, e.g.
  #   docker compose --profile serving --profile ui up -d --build
  # `--profile ui` alone cannot resolve `depends_on: scorer` -- the same
  # profile-scoping hazard scripts/startup.sh already documents for `pathway`.
  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    profiles: [ui]
    env_file:
      - .env
    # POSTGRES_HOST comes straight from .env, unmodified -- the warehouse Postgres
    # is an external managed service (see the `pathway` service's comment).
    # C3_SCORER_URL/C3_EVENT_DIR still need overriding: they're host-relative
    # (localhost, a bind-mounted path) and must instead reach the `scorer` compose
    # service and the `events` volume mounted into this container.
    environment:
      C3_SCORER_URL: http://scorer:3000
      C3_EVENT_DIR: /events
    ports:
      - "${C3_UI_PORT:-8501}:8501"
    volumes:
      # Read-only: the UI reads scored events for the Inspection tab and never
      # writes them -- only the scorer's own JsonlEventSink does that.
      - events:/events:ro
    networks: [c3net]
    depends_on:
      scorer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    # conquer3 ui (src/conquer3/ui/app.py via cli.py's `_cmd_ui`) -- Layer 9.

  # ──────────────────────────────── demo ────────────────────────────────
  producer:
    build:
      context: .
      dockerfile: docker/pipeline.Dockerfile
    profiles: [demo]
    env_file:
      - .env
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/data:/data:ro
    networks: [c3net]
    depends_on:
      scorer:
        condition: service_healthy
    # Entry point is producer/replay.py -- a thin client shim around
    # /invocations, not built yet.
