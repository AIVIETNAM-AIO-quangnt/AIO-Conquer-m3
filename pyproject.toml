[project]
name = "conquer3"
version = "0.1.0"
description = "End-to-end credit-fraud detection MLOps platform on PaySim1"
readme = "README.md"
requires-python = ">=3.12"

# INTENTIONALLY EMPTY, FOREVER.
# `conquer3.core` must be importable with a bare `pip install .` so that Colab can
# install it without dragging in duckdb/pathway/bentoml. See tests/contract/.
dependencies = [
    "lightgbm>=4.7.0",
    "psycopg2>=2.9.12",
    "xgboost>=3.4.1",
]

[project.optional-dependencies]
# Extras, not [dependency-groups]: PEP 735 groups are NOT installable by pip from a
# git URL, and Colab installs via `pip install "conquer3[train] @ git+..."`.
otel = [
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp>=1.27",
]
registry = [
  # Full mlflow, NOT mlflow-skinny: logging a model from a skinny env writes
  # `mlflow-skinny` into the model's conda.yaml and breaks container-based serving.
  # Layer 5 no longer serves through mlflow at all (BentoML does), so the old
  # ">=3.5 because its scoring server is FastAPI-based" reason is gone; the floor
  # stays because Layer 4's registry behaviour is only verified against 3.x.
  "mlflow>=3.5,<4",
]
train = [
  "conquer3[registry]",
  "scikit-learn>=1.5,<1.8",
  "pandas>=2.2",
  "numpy>=2",
  "pyarrow>=17",
  "joblib>=1.4",
  "kagglehub>=0.3",
  "matplotlib>=3.9",
  "tqdm>=4.66",
]
serving = [
  "conquer3[registry,otel]",
  # BentoML owns the web stack (starlette/uvicorn are its own transitive deps,
  # not ours to pin) and, more to the point, the OpenAPI document: it derives
  # /docs.json from the pydantic models in serving/api_models.py. mlflow is still
  # here via `registry`, but only to resolve and load the champion artifact --
  # nothing in a worker process serves HTTP through it.
  "bentoml>=1.4,<2",
  "redis>=5.0",
  "scikit-learn>=1.5,<1.8",
  "pandas>=2.2",
  "numpy>=2",
  "joblib>=1.4",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
]
pipeline = [
  "conquer3[otel]",
  "kagglehub>=1.0.2",
  "ibis-framework[duckdb,postgres]>=9.5",
  "duckdb>=1.1",
  "polars>=1.9",
  "psycopg2-binary>=2.9.12",
  "pyarrow>=17",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
]
stream = [
  "conquer3[otel]",
  "pathway>=0.16",
  "redis>=5.0",
  "psycopg2-binary>=2.9.12",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
]
producer = [
  "conquer3[otel]",
  # Reads a raw PaySim CSV and POSTs it to the scorer's HTTP API -- no mlflow,
  # duckdb, or bentoml import anywhere in conquer3.producer (see the "layered
  # architecture" import-linter contract: producer and serving are siblings,
  # neither may import the other).
  "pandas>=2.2",
  "httpx>=0.27",
]
ui = [
  # producer: pandas + httpx, reused for CSV upload validation and the scorer
  # HTTP client. registry: full mlflow, to list/promote versions through the
  # single module that owns the MLflow contract (contracts/model_registry.py)
  # rather than a second, hand-rolled REST client.
  "conquer3[producer,registry]",
  "streamlit>=1.40",
  "scikit-learn>=1.5,<1.8",   # precision / recall / fbeta / PR / ROC
  "psycopg2-binary>=2.9.12",  # ops.prediction_labels
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
]

[dependency-groups]
# uv-only tooling; never ships in any image.
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.7",
  "mypy>=1.11",
  "import-linter>=2.1",
]
it = ["testcontainers[postgres,redis]>=4.8", "httpx>=0.27"]

[project.scripts]
conquer3 = "conquer3.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

# ─────────────────────────── import boundaries ───────────────────────────
# These contracts are the machine-checked form of the architecture. The single
# most important one is "core stays dependency-light".
[tool.importlinter]
root_packages = ["conquer3"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core stays dependency-light (it ships to Colab)"
type = "forbidden"
source_modules = ["conquer3.core"]
forbidden_modules = [
  "numpy", "pandas", "polars", "pyarrow", "pydantic", "pydantic_settings",
  "redis", "duckdb", "ibis", "pathway", "mlflow", "sklearn",
  "joblib", "psycopg", "psycopg2", "opentelemetry",
  "conquer3.config", "conquer3.db", "conquer3.serving",
  "conquer3.pipelines", "conquer3.contracts", "conquer3.telemetry",
  "conquer3.redis_scripts", "conquer3.ui",
]

[[tool.importlinter.contracts]]
name = "contracts.events is stdlib-only"
type = "forbidden"
source_modules = ["conquer3.contracts.events"]
forbidden_modules = [
  "numpy", "pandas", "pydantic", "mlflow", "redis", "duckdb", "ibis",
  "pathway", "bentoml", "sklearn",
]

[[tool.importlinter.contracts]]
name = "serving never touches the warehouse or dataflow stack"
type = "forbidden"
source_modules = ["conquer3.serving"]
forbidden_modules = [
  "conquer3.db", "conquer3.pipelines",
  "duckdb", "ibis", "pathway", "polars",
]

[[tool.importlinter.contracts]]
name = "pipelines never import serving"
type = "forbidden"
source_modules = ["conquer3.pipelines"]
forbidden_modules = ["conquer3.serving"]

[[tool.importlinter.contracts]]
name = "ui talks to serving over HTTP, never by import"
type = "forbidden"
source_modules = ["conquer3.ui"]
# Not ibis/duckdb: conquer3.ui.labels legitimately reaches db.engine.pg_connection,
# and db.engine is *also* (correctly) db.get_ibis_connection's home -- import-linter's
# "forbidden" contract walks the whole transitive graph, so ibis/duckdb would always
# be "reachable" through that one shared module regardless of db.engine's own lazy
# import. The invariant this contract actually protects is narrower: ui must never
# import serving code (or bentoml) directly, since that would pull the scoring
# service itself into the UI image instead of talking to it over HTTP.
forbidden_modules = ["conquer3.serving", "bentoml", "pathway"]

[[tool.importlinter.contracts]]
name = "layered architecture"
type = "layers"
layers = [
  # ui sits above serving|producer|pipelines (not a sibling): it imports
  # producer.replay for CSV validation, which import-linter's "|" siblings may
  # not do to each other.
  "conquer3.ui",
  "conquer3.serving | conquer3.producer | conquer3.pipelines",
  "conquer3.db",
  "conquer3.contracts",
  "conquer3.telemetry",
  "conquer3.config",
  "conquer3.core | conquer3.redis_scripts",
]
exhaustive = false

# ─────────────────────────────── tooling ───────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "ANN", "TID"]
ignore = ["ANN401", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"dags/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["conquer3"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "kagglehub.*", "pathway.*", "ibis.*", "duckdb.*", "mlflow.*",
  "pandas.*", "sklearn.*", "streamlit.*", "psycopg2.*", "yaml.*",
]
ignore_missing_imports = true

# `@bentoml.api` is an overloaded decorator returning `APIMethod[P, R] | Callable[...]`,
# which mypy cannot resolve to a typed callable, so every route would be reported as
# "untyped decorator makes function untyped". The route bodies themselves stay fully
# type-checked; only the decorator's own typing is conceded, and only in this module.
[[tool.mypy.overrides]]
module = ["conquer3.serving.service"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: builds an isolated venv or touches large data",
  "integration: needs docker-compose services running",
  "pathway: spawns a real pw.run() in its own subprocess; slow, one-shot per process",
  "mlflow: spawns a real local mlflow server subprocess; no Docker needed",
  "eval: benchmarks a live scorer + real MLflow registry over HTTP (latency/label/score comparison, not a correctness gate); skips cleanly if no live scorer is reachable",
]

[tool.coverage.run]
source = ["conquer3"]
