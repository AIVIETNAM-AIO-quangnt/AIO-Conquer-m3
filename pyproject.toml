[project]
name = "conquer3"
version = "0.1.0"
description = "End-to-end credit-fraud detection MLOps platform on PaySim1"
readme = "README.md"
requires-python = ">=3.12"

# INTENTIONALLY EMPTY, FOREVER.
# `conquer3.core` must be importable with a bare `pip install .` so that Colab can
# install it without dragging in duckdb/pathway/bentoml. See tests/contract/.
dependencies = []

[project.optional-dependencies]
# Extras, not [dependency-groups]: PEP 735 groups are NOT installable by pip from a
# git URL, and Colab installs via `pip install "conquer3[train] @ git+..."`.
otel = [
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp>=1.27",
]
registry = [
  # Full mlflow, NOT mlflow-skinny: logging a model from a skinny env writes
  # `mlflow-skinny` into the model's conda.yaml and breaks container-based serving.
  # >=3.5 is load-bearing: 2.x's model-serving CLI serves via Flask+gunicorn, 3.5+
  # via FastAPI+uvicorn -- Layer 5 depends on the latter (see `serving` below).
  "mlflow>=3.5,<4",
]
train = [
  "conquer3[registry]",
  "scikit-learn>=1.5,<1.8",
  "pandas>=2.2",
  "numpy>=2",
  "pyarrow>=17",
  "joblib>=1.4",
  "kagglehub>=0.3",
  "matplotlib>=3.9",
  "tqdm>=4.66",
]
serving = [
  "conquer3[registry,otel]",
  # mlflow does NOT depend on these unconditionally -- confirmed by reading
  # mlflow.pyfunc.scoring_server.app's source: it imports fastapi/uvicorn lazily,
  # inside scoring_server.init(), and only mlflow's own `gateway`/`genai` extras
  # (which also pull in boto3, tiktoken, etc. -- unrelated to serving a local
  # sklearn model) declare them as real dependencies. We are the inference
  # endpoint (not a gateway to anything), so we depend on exactly what
  # `mlflow.pyfunc.scoring_server` needs, directly and minimally.
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "redis>=5.0",
  "scikit-learn>=1.5,<1.8",
  "pandas>=2.2",
  "numpy>=2",
  "joblib>=1.4",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
]
pipeline = [
  "conquer3[otel]",
  "kagglehub>=1.0.2",
  "ibis-framework[duckdb,postgres]>=9.5",
  "duckdb>=1.1",
  "polars>=1.9",
  "psycopg[binary,pool]>=3.2",
  "pyarrow>=17",
  "pydantic-settings>=2.4",
]
stream = [
  "conquer3[otel]",
  "pathway>=0.16",
  "redis>=5.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
]

[dependency-groups]
# uv-only tooling; never ships in any image.
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.7",
  "mypy>=1.11",
  "import-linter>=2.1",
]
it = ["testcontainers[postgres,redis]>=4.8", "httpx>=0.27"]

[project.scripts]
conquer3 = "conquer3.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

# ─────────────────────────── import boundaries ───────────────────────────
# These contracts are the machine-checked form of the architecture. The single
# most important one is "core stays dependency-light".
[tool.importlinter]
root_packages = ["conquer3"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core stays dependency-light (it ships to Colab)"
type = "forbidden"
source_modules = ["conquer3.core"]
forbidden_modules = [
  "numpy", "pandas", "polars", "pyarrow", "pydantic", "pydantic_settings",
  "redis", "duckdb", "ibis", "pathway", "mlflow", "sklearn",
  "joblib", "psycopg", "opentelemetry",
  "conquer3.config", "conquer3.db", "conquer3.serving",
  "conquer3.pipelines", "conquer3.contracts", "conquer3.telemetry",
  "conquer3.redis_scripts",
]

[[tool.importlinter.contracts]]
name = "contracts.events is stdlib-only"
type = "forbidden"
source_modules = ["conquer3.contracts.events"]
forbidden_modules = [
  "numpy", "pandas", "pydantic", "mlflow", "redis", "duckdb", "ibis",
  "pathway", "bentoml", "sklearn",
]

[[tool.importlinter.contracts]]
name = "serving never touches the warehouse or dataflow stack"
type = "forbidden"
source_modules = ["conquer3.serving"]
forbidden_modules = [
  "conquer3.db", "conquer3.pipelines",
  "duckdb", "ibis", "pathway", "polars",
]

[[tool.importlinter.contracts]]
name = "pipelines never import serving"
type = "forbidden"
source_modules = ["conquer3.pipelines"]
forbidden_modules = ["conquer3.serving"]

[[tool.importlinter.contracts]]
name = "layered architecture"
type = "layers"
layers = [
  "conquer3.serving | conquer3.producer | conquer3.pipelines",
  "conquer3.db",
  "conquer3.contracts",
  "conquer3.telemetry",
  "conquer3.config",
  "conquer3.core | conquer3.redis_scripts",
]
exhaustive = false

# ─────────────────────────────── tooling ───────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "ANN", "TID"]
ignore = ["ANN401", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"dags/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["conquer3"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
  "kagglehub.*", "pathway.*", "ibis.*", "duckdb.*", "mlflow.*",
  "pandas.*", "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: builds an isolated venv or touches large data",
  "integration: needs docker-compose services running",
  "pathway: spawns a real pw.run() in its own subprocess; slow, one-shot per process",
  "mlflow: spawns a real local mlflow server subprocess; no Docker needed",
]

[tool.coverage.run]
source = ["conquer3"]
