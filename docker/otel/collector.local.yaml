# Local development collector config: same receivers/processors as the remote one,
# debug exporter only. Lets the whole stack run end-to-end with zero remote
# credentials. Selected via C3_OTEL_COLLECTOR_CONFIG=collector.local.yaml.
#
# App code never references this file or any backend directly -- it only knows
# OTEL_EXPORTER_OTLP_ENDPOINT (see conquer3.telemetry.otel). Swapping to
# collector.remote.yaml is a config change, not a code change.

# otlp is the ONLY receiver -- push-only, on purpose. MLflow's scoring server
# (plan §8.7) exposes no /metrics route to scrape, so every process (scorer,
# Pathway, Airflow tasks) pushes OTLP instead. This also sidesteps Prometheus
# multiprocess mode, which any multi-worker scrape endpoint would have forced.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 20
  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
  # account_id is per-transaction: ~6.3M distinct values. As a metric label that is
  # a cardinality bomb that would take Prometheus down. Account IDs belong in traces
  # and logs only, so this processor runs in the metrics pipeline exclusively.
  attributes/strip_account_id:
    actions:
      - key: account_id
        action: delete
  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  debug:
    verbosity: normal

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, attributes/strip_account_id, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [debug]
